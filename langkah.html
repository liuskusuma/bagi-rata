<style>
/* Layout: iOS app in a phone frame on wide screens, full screen on a phone. The screen ground is a court surface
   (grass, clay or hard court, picked in Settings) with chalk-white lines; all inputs sit on solid cards. Court colors
   are set from script per theme; the tokens below are the Wimbledon defaults. */
:root {
  --page: #e4e9df;
  --cell: #ffffff;
  --fg: #16201a;
  --muted: #69736c;
  --sep: #dde2dc;
  --court-deep: #193e0c;
  --court: #2c580b;
  --court-hi: #497718;
  --head: #193e0c;
  --chalk: #f4f2ea;
  --accent: #3a7012;
  --accent-ink: #ffffff;
  --bubble: #dcf3c8;
  --bubble-ink: #142310;
  --danger: #c8372d;
  --bezel: #1a1d18;
  --shade: rgba(0, 0, 0, .22);
  --stripes: none;
  --f: "Plus Jakarta Sans", -apple-system, system-ui, sans-serif;
  --f-display: "Outfit", "Plus Jakarta Sans", system-ui, sans-serif;
  --f-num: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0a0c0b; --cell: #1b1e1c; --fg: #eef2ee; --muted: #9ba39d; --sep: #323833;
  --accent-ink: #101410; --bubble: #1f3d24; --bubble-ink: #e9f0ea; --danger: #ff6b5e; --bezel: #2a2e2b;
  --shade: rgba(0, 0, 0, .55); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --page: #0a0c0b; --cell: #1b1e1c; --fg: #eef2ee; --muted: #9ba39d; --sep: #323833;
  --accent-ink: #101410; --bubble: #1f3d24; --bubble-ink: #e9f0ea; --danger: #ff6b5e; --bezel: #2a2e2b;
  --shade: rgba(0, 0, 0, .55); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--page); color: var(--fg); font-family: var(--f); font-size: 17px; line-height: 1.3; }
.stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 40px; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
.side { max-width: 280px; color: var(--muted); font-size: 14px; line-height: 1.5; }
.side h1 { font-family: var(--f-display); color: var(--fg); font-size: 24px; margin: 0 0 8px; letter-spacing: -.01em; }
.guide { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--sep); }
.guide h3 { font-family: var(--f-display); color: var(--fg); font-size: 15px; margin: 0 0 10px; }
.sw { display: flex; gap: 6px; margin-bottom: 8px; }
.sw span { width: 36px; height: 36px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.phone { width: 390px; height: 844px; max-width: 100%; border-radius: 54px; background: var(--bezel); padding: 12px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.35); flex: 0 0 auto; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background-color: var(--court); background-image: linear-gradient(var(--shade), var(--shade)), var(--stripes), var(--court-tex, none); display: flex; flex-direction: column; }
.lawn { background-color: var(--head); background-image: linear-gradient(rgba(0,0,0,.32), rgba(0,0,0,.32)), var(--stripes), var(--head-tex, none); color: var(--chalk); flex: 0 0 auto; position: relative; }
.lawn::after { content: ""; position: absolute; left: 0; right: 0; bottom: 10px; border-top: 3px solid var(--chalk); opacity: .9; }
.status { height: 50px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0; font-weight: 600; font-size: 16px; position: relative; }
.status::after { content: ""; position: absolute; left: 50%; top: 11px; width: 120px; height: 34px; border-radius: 20px; background: #000; transform: translateX(-50%); }
.status .icons { display: flex; gap: 6px; align-items: center; }
@media (max-width: 520px) {
  .side { display: none; }
  .stage { padding: 0; display: block; }
  .phone { width: 100%; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; background: var(--court); }
  .screen { border-radius: 0; }
  .status { display: none; }
  .nav { padding-top: max(8px, env(safe-area-inset-top, 0px)); }
}
.nav { padding: 4px 16px 24px 20px; display: flex; align-items: center; gap: 14px; }
.nav img { width: 48px; height: 48px; border-radius: 12px; box-shadow: 0 0 0 2px var(--chalk); flex: 0 0 auto; }
.nav h2 { font-family: var(--f-display); font-size: 32px; font-weight: 800; letter-spacing: -.01em; margin: 0; line-height: 1; }
.nav p { margin: 4px 0 0; color: var(--chalk); opacity: .85; font-size: 14px; }
.nav .titles { flex: 1 1 auto; min-width: 0; }
.gear { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.28); color: var(--chalk); flex: 0 0 auto; }
.gear[aria-pressed="true"] { background: var(--chalk); color: var(--court-deep); }
.gear svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.content { flex: 1 1 auto; overflow-y: auto; padding: 4px 16px 24px; -webkit-overflow-scrolling: touch; }
.group-title { font-family: var(--f-display); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--chalk); text-shadow: 0 1px 3px rgba(0,0,0,.7); margin: 18px 16px 6px; display: flex; justify-content: space-between; align-items: baseline; }
.group-title:first-child { margin-top: 6px; }
.group { background: var(--cell); border-radius: 16px; overflow: hidden; }
.foot { font-size: 13px; font-weight: 500; color: var(--chalk); text-shadow: 0 1px 3px rgba(0,0,0,.75); background: rgba(0,0,0,.32); padding: 6px 10px; border-radius: 10px; margin: 6px 16px 0; line-height: 1.4; }
.row { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--sep); }
.row > label, .row > .lbl { flex: 0 0 auto; color: var(--fg); }
.row input, .row select { font: inherit; color: var(--fg); background: transparent; border: 0; outline: none; text-align: right; flex: 1 1 auto; min-width: 0; padding: 4px 0; }
.row input::placeholder { color: var(--muted); opacity: .7; }
.row input.left { text-align: left; }
.row input:focus-visible, .row select:focus-visible { box-shadow: 0 2px 0 var(--accent); }
.row select { direction: rtl; color: var(--muted); }
.row .val { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.money { font-variant-numeric: tabular-nums; }
.row .rp { color: var(--muted); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.link { color: var(--accent); }
.danger { color: var(--danger); font-size: 15px; }
.group-title .danger { color: #ffe1dc; text-shadow: none; background: rgba(120, 20, 10, .6); padding: 3px 12px; border-radius: 99px; font-family: var(--f); text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 600; }
.group-title .pill { text-shadow: none; }
.addrow { color: var(--accent); width: 100%; text-align: left; }
.minus { width: 22px; height: 22px; border-radius: 50%; background: var(--danger); color: #fff; flex: 0 0 auto; display: grid; place-items: center; font-weight: 700; line-height: 1; }
.seg { display: flex; background: color-mix(in srgb, var(--muted) 18%, transparent); border-radius: 9px; padding: 2px; flex: 1 1 auto; }
.seg button { flex: 1 1 0; font-size: 14px; padding: 6px 8px; border-radius: 7px; color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: 700; }
.stepper { display: flex; align-items: center; margin-left: auto; background: color-mix(in srgb, var(--muted) 18%, transparent); border-radius: 9px; }
.stepper button { width: 40px; height: 32px; font-size: 20px; color: var(--accent); }
.stepper span { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 12px; position: relative; }
.chips::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--sep); }
.chip { font-size: 14px; padding: 6px 12px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.switch { margin-left: auto; width: 51px; height: 31px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 35%, transparent); position: relative; flex: 0 0 auto; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.summary { flex: 0 0 auto; margin: 0 12px 8px; background-color: var(--court-deep); background-image: var(--stripes); color: var(--chalk); border-radius: 16px; padding: 12px 16px; box-shadow: inset 0 0 0 3px var(--court-deep), inset 0 0 0 5px var(--chalk); display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 15px; }
.summary b { font-family: var(--f-display); font-size: 19px; font-variant-numeric: tabular-nums; }
.tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 0.5px solid var(--sep); background: var(--cell); padding: 6px 4px calc(6px + max(16px, env(safe-area-inset-bottom, 0px))); }
.tabs button { display: grid; justify-items: center; gap: 2px; font-size: 10.5px; color: var(--muted); padding: 2px 0; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.bubble { background: var(--bubble); color: var(--bubble-ink); border-radius: 12px 12px 12px 4px; padding: 10px 12px; white-space: pre-wrap; font-size: 15px; line-height: 1.35; margin: 0; font-family: var(--f); overflow-wrap: anywhere; }
.btn { display: block; width: 100%; text-align: center; border-radius: 12px; padding: 14px; font-weight: 600; text-decoration: none; }
.btn-wa { background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-size: 18px; }
.btn-copy { background: var(--cell); color: var(--accent); }
.btns { display: grid; gap: 10px; margin-top: 12px; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.pill.ok { background: var(--chalk); color: #1d2a1f; }
.pill.warn { background: #ffe2c4; color: #7a3500; }
.person { width: 100%; text-align: left; }
.person .name { flex: 1 1 auto; }
.person .amt { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
.person .chev { color: var(--muted); transition: transform .2s; }
.person[aria-expanded="true"] .chev { transform: rotate(90deg); }
.explain { padding: 0 16px 12px; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
.explain b { color: var(--fg); font-weight: 600; }
.explain .f { font-family: var(--f-num); font-size: 11.5px; display: block; }
.tag { font-size: 12px; color: var(--muted); margin-left: 6px; }
.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.theme { background: var(--cell); border-radius: 16px; padding: 8px; text-align: left; display: grid; gap: 8px; box-shadow: 0 0 0 0 var(--chalk); }
.theme[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--chalk), 0 0 0 5px rgba(0,0,0,.35); }
.theme .court { height: 74px; border-radius: 10px; position: relative; overflow: hidden; background-size: auto, 90px 90px; }
.theme .court::before { content: ""; position: absolute; inset: 12px 14px; border: 2px solid rgba(255,255,255,.9); }
.theme .court::after { content: ""; position: absolute; left: 50%; top: 12px; bottom: 12px; border-left: 2px solid rgba(255,255,255,.9); }
.theme b { font-family: var(--f-display); font-size: 15px; display: block; padding: 0 4px; }
.theme span { font-size: 12px; color: var(--muted); padding: 0 4px 4px; display: block; }
.toast { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); background: rgba(30,30,30,.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; }
.stepbar { flex: 0 0 auto; display: flex; gap: 10px; padding: 10px 12px calc(10px + max(14px, env(safe-area-inset-bottom, 0px))); background: var(--cell); border-top: 0.5px solid var(--sep); }
.stepbar button { border-radius: 12px; padding: 14px 16px; font-weight: 600; }
.stepbar .prev { flex: 0 0 auto; color: var(--accent); background: color-mix(in srgb, var(--muted) 14%, transparent); }
.stepbar .next { flex: 1 1 auto; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-size: 17px; }
.stepbar .next.alt { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.progress { display: flex; gap: 5px; margin-top: 8px; }
.progress button { flex: 1 1 0; height: 17px; padding: 6px 0; background: rgba(255,255,255,.28); background-clip: content-box; border-radius: 99px; }
.progress button.done { background-color: var(--chalk); }
.progress button[aria-current="step"] { box-shadow: 0 0 0 2px rgba(0,0,0,.25); }
[hidden] { display: none !important; }
.nav h2 { font-size: 27px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ask { font-family: var(--f-display); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

const shade = (hex, a) => {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(a < 0 ? v * (1 + a) : v + (255 - v) * a));
  return "#" + c.map(v => v.toString(16).padStart(2, "0")).join("");
};
// Seamless surface tile: grass blades, clay grains or the fine sand grit of an acrylic hard court.
function surfaceTile(kind, base) {
  const N = 180, c = document.createElement("canvas"); c.width = c.height = N;
  const x = c.getContext("2d"); let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  x.fillStyle = base; x.fillRect(0, 0, N, N);
  const wrap = draw => { for (const dx of [-N, 0, N]) for (const dy of [-N, 0, N]) draw(dx, dy); };
  if (kind === "grass") {
    const tones = [-.35, -.25, -.12, 0, .1, .2, .3].map(a => shade(base, a));
    for (let i = 0; i < 3200; i++) {
      const px = rnd() * N, py = rnd() * N, len = 3 + rnd() * 7, ang = -Math.PI / 2 + (rnd() - .5) * 1.1;
      x.strokeStyle = tones[Math.floor(rnd() * tones.length)]; x.lineWidth = .7 + rnd() * .9; x.lineCap = "round";
      const ex = Math.cos(ang) * len, ey = Math.sin(ang) * len;
      wrap((dx, dy) => { x.beginPath(); x.moveTo(px + dx, py + dy); x.lineTo(px + dx + ex, py + dy + ey); x.stroke(); });
    }
  } else if (kind === "clay") {
    const tones = [-.3, -.18, -.08, .08, .16, .26].map(a => shade(base, a));
    for (let i = 0; i < 7000; i++) {
      const px = rnd() * N, py = rnd() * N, r = .4 + rnd() * 1.1;
      x.fillStyle = tones[Math.floor(rnd() * tones.length)];
      wrap((dx, dy) => { x.beginPath(); x.arc(px + dx, py + dy, r, 0, 7); x.fill(); });
    }
    // faint sweep marks left by the line brush
    x.globalAlpha = .06; x.strokeStyle = "#fff";
    for (let i = 0; i < 14; i++) { const py = rnd() * N; x.lineWidth = 1 + rnd() * 2; x.beginPath(); x.moveTo(0, py); x.lineTo(N, py + (rnd() - .5) * 6); x.stroke(); }
    x.globalAlpha = 1;
  } else {
    for (let i = 0; i < 9000; i++) {
      const px = Math.floor(rnd() * N), py = Math.floor(rnd() * N), light = rnd() < .5;
      x.fillStyle = light ? `rgba(255,255,255,${.04 + rnd() * .09})` : `rgba(0,0,0,${.05 + rnd() * .12})`;
      x.fillRect(px, py, 1, 1);
    }
  }
  return `url(${c.toDataURL("image/png")})`;
}

function applyCourt() {
  const t = COURTS[P.court] || COURTS.wimbledon, st = document.documentElement.style;
  st.setProperty("--court-deep", t.deep); st.setProperty("--court", t.base); st.setProperty("--court-hi", t.hi); st.setProperty("--head", t.head);
  st.setProperty("--accent", isDark() ? t.accentDark : t.accent);

  try {
    st.setProperty("--court-tex", tile(t.tex, t.base));
    st.setProperty("--head-tex", tile(t.head === t.deep || t.tex !== "hard" ? t.tex : "hard", t.head));
  } catch (e) {}
}

  costs: [

  ],

});
let S, P;
try { S = JSON.parse(localStorage.getItem(KEY)) || SAMPLE(); } catch (e) { S = SAMPLE(); }
try { P = JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (e) { P = {}; }
P = Object.assign({ lang: "id", court: "wimbledon" }, P);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(PKEY, JSON.stringify(P)); } catch (e) {} };
const L = () => STR[P.lang] || STR.id;
const uid = p => p + Math.random().toString(36).slice(2, 8);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rp = n => "Rp " + Math.round(n).toLocaleString("id-ID");
const rb = n => { const k = Math.round(n) / 1000; return (Number.isInteger(k) ? k : +k.toFixed(1)) + L().k; };
const fmt = v => Math.round(v).toLocaleString("id-ID");
// Rupiah amounts are whole numbers; dots and commas are thousand separators.
const num = v => +String(v).replace(/\D/g, "") || 0;
const money = v => (+v ? (+v).toLocaleString("id-ID") : "");

// Money fields format thousands while typing (600000 shows as 600.000); runs before the field handlers.
document.addEventListener("input", e => {
  const el = e.target; if (!el.classList || !el.classList.contains("money")) return;
  const pos = el.selectionStart ?? el.value.length;
  const digitsRight = el.value.slice(pos).replace(/\D/g, "").length;
  el.value = money(num(el.value));
  let i = el.value.length, seen = 0;
  while (i > 0 && seen < digitsRight) { i--; if (/\d/.test(el.value[i])) seen++; }
  try { el.setSelectionRange(i, i); } catch (err) {}
}, true);

const BULAN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function dateLine(v) {
  if (!v) return "";
  const [y, m, d] = v.split("-").map(Number);
  return `${L().days[new Date(y, m - 1, d).getDay()]}, ${d} ${BULAN[m - 1]}`;
}
// Session runs from the earliest court start to the latest court end (minutes; wraps past midnight).
const toMin = v => { const [h, m] = (v || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
function span() {
  if (!S.courts.length) return { a: 0, b: 0, list: [] };
  const first = Math.min(...S.courts.map(c => toMin(c.start)));
  const list = S.courts.map(c => { let a = toMin(c.start) - first; if (a < 0) a += 1440; return { c, a: a / 60, b: a / 60 + (+c.hours || 0) }; });
  return { a: first, b: Math.max(...list.map(x => x.b)), list };
}
const fullHours = () => span().b;
const courtHours = () => S.courts.reduce((t, c) => t + (+c.hours || 0), 0);
const sessionStart = () => S.courts.length ? clock(0) : "";
const sessionEnd = () => S.courts.length ? clock(fullHours()) : "";
function clock(offset) {
  const first = S.courts.length ? Math.min(...S.courts.map(c => toMin(c.start))) : 0;
  const t = ((Math.round(first + offset * 60) % 1440) + 1440) % 1440;
  return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
}
const hoursOf = p => { const x = S.partial.find(q => q.player === p.id); return x ? +x.hours || 0 : fullHours(); };
const hasHourly = () => S.costs.some(c => c.split === "hours");

// Per-hour costs are split hour by hour among the players on court; early leavers count from the start.
function compute() {
  const ps = S.players, T = L();
  const rows = ps.map(p => ({ p, parts: {}, food: 0, foodLines: [] }));
  if (S.foodOn) for (const f of S.foodItems) {
    const who = f.who.filter(id => ps.some(p => p.id === id)); if (!who.length) continue;
    const each = f.mode === "split" ? (+f.price || 0) / who.length : +f.price || 0;
    for (const r of rows) if (who.includes(r.p.id)) {
      r.food += each;
      r.foodLines.push(f.mode === "split" ? `${f.name}: ${fmt(+f.price || 0)} ÷ ${who.length} ${T.people} = ${fmt(each)}` : `${f.name}: ${fmt(each)}`);
    }
  }
  // Per-hour costs follow court-hours: each time slice costs (courts in use × its length) ÷ total court-hours,
  // shared by the players on court then. Players who left early count from the start.
  const sp = span(), H = sp.b, CH = courtHours();
  const hs = rows.map(r => Math.min(hoursOf(r.p), H));
  const pts = [...new Set([0, H, ...hs, ...sp.list.flatMap(x => [x.a, x.b])])].filter(x => x >= 0 && x <= H).sort((a, b) => a - b);
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], present = rows.map((r, j) => j).filter(j => hs[j] > a);
    const w = sp.list.filter(x => x.a <= a && x.b >= b).length;
    if (present.length && w) segs.push({ a, b, present, w });
  }
  let costTotal = 0;
  for (const c of S.costs) {
    const amt = Math.max(0, +c.amount || 0); costTotal += amt;
    rows.forEach(r => r.parts[c.id] = 0);
    if (c.split === "hours" && CH > 0) {
      for (const s of segs) for (const j of s.present) rows[j].parts[c.id] += amt * s.w * (s.b - s.a) / CH / s.present.length;
    } else for (const r of rows) r.parts[c.id] = ps.length ? amt / ps.length : 0;
  }
  const foodTotal = rows.reduce((a, r) => a + r.food, 0);
  costTotal += foodTotal;
  for (const r of rows) {
    r.raw = Object.values(r.parts).reduce((a, b) => a + b, 0) + r.food;
    const raw = Math.round(r.raw);
    r.final = S.round === "1000" ? Math.ceil(raw / 1000) * 1000 : S.round === "down1000" ? Math.floor(raw / 1000) * 1000 : raw;
  }
  const allShares = rows.reduce((a, r) => a + r.final, 0);
  const collected = rows.reduce((a, r) => a + (r.p.id === S.payer ? 0 : r.final), 0);
  return { rows, costTotal, foodTotal, collected, allShares, payerShare: allShares - collected, segs, CH };
}
function buildMessage(res) {
  const lines = S.title ? [S.title] : [];
  if (S.vs) lines.push("", "VS " + S.vs);
  if (lines.length) lines.push("");
  const dl = dateLine(S.date); if (dl) lines.push(dl);
  const sp = span();
  const sameTime = sp.list.every(x => x.a === sp.list[0].a && x.b === sp.list[0].b);
  if (sameTime) {
    const names = S.courts.map(c => c.name).filter(Boolean).join(", ");
    const place = [S.venue, names ? `(${names})` : ""].filter(Boolean).join(" ");
    if (place) lines.push("📍" + place);
    if (S.courts.some(c => c.start)) lines.push(`${sessionStart()}-${sessionEnd()}`);
  } else {
    if (S.venue) lines.push("📍" + S.venue);
    for (const x of sp.list) lines.push(`${x.c.name}: ${clock(x.a)}-${clock(x.b)}`);
  }
  lines.push("");
  for (const r of res.rows) if (r.p.name && r.p.id !== S.payer) lines.push(`${r.p.name} - ${rb(r.final)}`);
  if (S.bank) lines.push("", S.bank);
  return lines.join("\n");
}

function viewBiaya(T) {

function viewMakanan(T) {
  return `
    ${S.players.length ? "" : `<p class="foot" style="margin-bottom:12px">${T.needPlayers}</p>`}
    <div class="group" style="margin-top:6px"><div class="row"><span class="lbl ask">${T.foodAsk}</span>

        <div class="row"><label>${T.name}</label><input aria-label="${T.foodName}" data-col="foodItems" data-id="${f.id}" data-k="name" value="${esc(f.name)}" placeholder="${T.foodName}"></div>

      <p class="foot">${T.foodNote}</p>`
    : `<p class="foot">${T.foodSkip}</p>`}`;
}

function explainHtml(T, res, r) {
  const H = fullHours(), idx = res.rows.indexOf(r), n = res.rows.length;
  const items = S.costs.map(c => {
    const net = Math.max(0, +c.amount || 0);
    const CH = res.CH;
    const f = c.split === "hours" && CH > 0
      ? `${fmt(net)} ÷ ${CH} ${T.courtHours} = ${fmt(net / CH)}/${T.perHourShort}<br>` + res.segs.filter(s => s.present.includes(idx))
          .map(s => `${clock(s.a)}–${clock(s.b)}: ${s.w > 1 ? `${s.w} ${T.crt} × ` : ""}${s.b - s.a} ${T.perHourShort} ÷ ${s.present.length} ${T.ppl} = ${fmt(net * s.w * (s.b - s.a) / CH / s.present.length)}`).join("<br>")
      : `${fmt(net)} ÷ ${n} ${T.ppl} = ${fmt(r.parts[c.id])}`;
    return `<div><b>${esc(c.name)}</b> ${fmt(r.parts[c.id])}<span class="f">${f}</span></div>`;
  });
  if (S.foodOn && r.foodLines.length) items.push(`<div><b>${T.food}</b> ${fmt(r.food)}<span class="f">${r.foodLines.map(esc).join("<br>")}</span></div>`);
  items.push(`<div><b>${T.total}</b> ${fmt(r.raw)}, ${T.rounded[S.round]} = ${fmt(r.final)}</div>`);
  return items.join("");
}

function viewTagihan(T) {
  const res = compute(), msg = buildMessage(res), diff = res.allShares - res.costTotal;
  const pill = Math.abs(diff) < 1 ? `<span class="pill ok">${T.exact}</span>` : diff > 0 ? `<span class="pill ok">${T.over} ${rb(diff)}</span>` : `<span class="pill warn">${T.short} ${rb(-diff)}</span>`;
  return `
    <div class="group-title">${T.summary} ${pill}</div>
    <div class="group">
      <div class="row"><span class="lbl">${T.totalCost}</span><span class="val">${rp(res.costTotal)}</span></div>
      <div class="row"><span class="lbl">${T.billed}</span><span class="val">${rp(res.collected)}</span></div>
      <div class="row"><span class="lbl">${T.payeeShare}</span><span class="val">${rp(res.payerShare)}</span></div>
    </div>
    <div class="group-title">${T.perPlayer}</div>
    <div class="group">
      ${res.rows.map(r => `<button type="button" class="row person" data-open="${r.p.id}" aria-expanded="${open === r.p.id}">
          <span class="name">${pname(r.p)}${r.p.id === S.payer ? `<span class="tag">${T.payeeTag}</span>` : ""}</span>
          <span class="amt">${rb(r.final)}</span><span class="chev">›</span></button>
        ${open === r.p.id ? `<div class="explain">${explainHtml(T, res, r)}</div>` : ""}`).join("")}
    </div>
    <p class="foot">${T.tapName}</p>
    <div class="group-title">${T.waMsg}</div>
    <pre class="bubble">${esc(msg)}</pre>
    <div class="btns">
      <a class="btn btn-wa" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${T.send}</a>
      <button type="button" class="btn btn-copy" id="copy">${T.copy}</button>
    </div>`;
}

function viewSetelan(T) {
  return `
    <div class="group-title">${T.language}</div>
    <div class="group"><div class="row">${seg('data-pref="lang"', P.lang, [["id", "Indonesia"], ["en", "English"]])}</div></div>
    <div class="group-title">${T.theme}</div>
    <div class="themes">${Object.entries(COURTS).map(([k, t]) => `
      <button type="button" class="theme" data-pref="court" data-v="${k}" aria-pressed="${P.court === k}">
        <div class="court" style="background-color:${t.base};background-image:${t.stripes ? "repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 18px, rgba(0,0,0,.08) 18px 36px)," : ""}${safeTile(t.tex, t.base)};${k === "uso" ? `box-shadow: inset 0 0 0 8px ${t.head};` : ""}"></div>
        <b>${t.name}</b><span>${T.surf[t.surf]}</span>
      </button>`).join("")}</div>
    <p class="foot">${T.themeNote}</p>`;
}
const safeTile = (kind, base) => { try { return tile(kind, base); } catch (e) { return "none"; } };

const VIEWS = { match: viewMatch, place: viewPlace, pay: viewPay, players: viewPemain, cost: viewBiaya, food: viewMakanan, bill: viewTagihan, setelan: viewSetelan };

function renderChrome() {
  const T = L(), t = COURTS[P.court];
  document.documentElement.lang = P.lang;
  $("side-title").textContent = T.sideTitle; $("side-intro").textContent = T.sideIntro; $("side-sample").textContent = T.sideSample;
  $("reset").textContent = T.reset; $("guide-title").textContent = `${T.guide}: ${t.name}`; $("guide-type").textContent = T.guideType;
  $("guide-sw").innerHTML = [t.deep, t.base, t.hi, t.head, "#f4f2ea", t.accentDark].map(c => `<span style="background:${c}"></span>`).join("");
  $("gear").setAttribute("aria-label", T.settings); $("gear").setAttribute("aria-pressed", tab === "setelan");
}
function render(keepScroll) {
  const T = L(), content = $("content"), top = content.scrollTop, i = STEPS.indexOf(tab);
  $("nav-title").textContent = T.tabs[tab];
  $("nav-sub").textContent = i >= 0 ? `${T.stepOf(i + 1, STEPS.length)} · ${T.subs[tab]}` : T.subs[tab];
  $("progress").innerHTML = STEPS.map((k, j) => `<button type="button" data-tab="${k}" class="${j <= i ? "done" : ""}" aria-label="${T.tabs[k]}"${k === tab ? ' aria-current="step"' : ""}></button>`).join("");
  content.innerHTML = VIEWS[tab](T);
  content.scrollTop = keepScroll ? top : 0;
  $("tabs").innerHTML = i < 0 ? `<button type="button" class="next" data-tab="${back}">${T.done}</button>`
    : (i > 0 ? `<button type="button" class="prev" data-tab="${STEPS[i - 1]}">‹ ${T.back}</button>` : "")
      + (i < STEPS.length - 1 ? `<button type="button" class="next" data-tab="${STEPS[i + 1]}">${T.next(T.tabs[STEPS[i + 1]])} ›</button>`
        : `<button type="button" class="next alt" id="new-bill">${T.newBill}</button>`);
  renderChrome();
  renderSummary();
}
function renderSummary() {
  const res = compute();
  $("summary").hidden = !["players", "cost", "food"].includes(tab) || !S.players.length;
  $("summary").innerHTML = `<span>${L().billing(res.rows.length - (S.payer ? 1 : 0))}</span><b>${rp(res.collected)} ›</b>`;
  save();
}
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1600); }

function removePlayer(id) {
  S.players = S.players.filter(p => p.id !== id);
  S.partial = S.partial.filter(q => q.player !== id);
  S.foodItems.forEach(f => f.who = f.who.filter(x => x !== id));
  if (S.payer === id) S.payer = "";
}
function onEdit(e) {
  const el = e.target;
  if (el.dataset.s) {
    S[el.dataset.s] = el.value;
    if (e.type === "change" && el.dataset.re !== undefined) render(true);
  } else if (el.dataset.col) {
    const item = S[el.dataset.col].find(x => x.id === el.dataset.id);
    item[el.dataset.k] = el.classList.contains("money") ? num(el.value) : el.value;
    if (e.type === "change" && el.dataset.re !== undefined) render(true);
  } else if (el.dataset.payee !== undefined) {
    const v = el.value.trim(), p = S.players.find(x => x.id === S.payer);
    if (v && p) p.name = el.value;
    else if (v) { const id = uid("p"); S.players.unshift({ id, name: el.value }); S.payer = id; }
    else if (p) { removePlayer(p.id); }
  } else if (el.dataset.partial !== undefined) {
    S.partial[+el.dataset.partial].player = el.value;
    if (e.type === "change") render(true);
  } else return;
  renderSummary();
}
$("content").addEventListener("input", onEdit);
$("content").addEventListener("change", onEdit);
// Group titles mirror the name fields; update them in place so a tap on another button is not lost to a re-render.
$("content").addEventListener("input", e => {
  const el = e.target, col = el.dataset.col;
  if (el.dataset.k !== "name" || (col !== "costs" && col !== "foodItems")) return;
  const t = el.closest(".group")?.previousElementSibling?.querySelector("span");
  if (t) t.textContent = el.value || (col === "costs" ? L().cost : L().food);
});

$("content").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset, T = L();
  if (d.pref) { P[d.pref] = d.v; if (d.pref === "court") applyCourt(); }
  else if (d.v !== undefined) {
    if (d.s) S[d.s] = d.v; else S[d.col].find(x => x.id === d.id)[d.k] = d.v;
  } else if (d.delPlayer) removePlayer(d.delPlayer); else if (d.delPartial !== undefined) S.partial.splice(+d.delPartial, 1);
  else if (d.step) { const q = S.partial[+d.i]; q.hours = Math.min(fullHours(), Math.max(0, q.hours + +d.step)); }
  else if (d.courtStep) { const c = S.courts.find(x => x.id === d.id); c.hours = Math.max(0.5, Math.min(24, c.hours + +d.courtStep)); }
  else if (d.delCourt) S.courts = S.courts.filter(c => c.id !== d.delCourt);
  else if (b.id === "add-court") { const last = S.courts[S.courts.length - 1]; S.courts.push({ id: uid("k"), name: (() => { let n = S.courts.length + 1; while (S.courts.some(c => c.name === T.courtN(n))) n++; return T.courtN(n); })(), start: last ? last.start : "18:00", hours: last ? last.hours : 2 }); }
  else if (d.delCost) S.costs = S.costs.filter(c => c.id !== d.delCost);
  else if (d.delFood) S.foodItems = S.foodItems.filter(f => f.id !== d.delFood);
  else if (d.food) { const f = S.foodItems.find(x => x.id === d.food); f.who = f.who.includes(d.p) ? f.who.filter(x => x !== d.p) : f.who.concat(d.p); }
  else if (d.open) open = open === d.open ? null : d.open;
  else if (b.id === "food-switch") S.foodOn = !S.foodOn;
  else if (b.id === "add-player") { S.players.push({ id: uid("p"), name: "" }); render(true); const ins = $("content").querySelectorAll('[data-col="players"]'); ins[ins.length - 1]?.focus(); return; }
  else if (b.id === "add-partial") { const free = S.players.find(p => !S.partial.some(q => q.player === p.id)); S.partial.push({ player: free.id, hours: Math.max(0, fullHours() - 1) }); }
  else if (b.id === "add-cost") S.costs.push({ id: uid("c"), name: T.newCost, amount: 0, split: "equal" });
  else if (b.id === "add-food") S.foodItems.push({ id: uid("f"), name: "", price: 0, mode: "each", who: [] });
  else if (b.id === "copy") {
    const text = buildMessage(compute());
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("content").querySelector(".bubble")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(T.selectFallback); };
    try { navigator.clipboard.writeText(text).then(() => toast(L().copied), fallback); } catch (err) { fallback(); }
    return;
  } else return;
  render(true);
});
const goStep = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "new-bill") { if (!confirm(L().newConfirm)) return; S = SAMPLE(); open = null; tab = "match"; }
  else if (b.dataset.tab) tab = b.dataset.tab; else return;
  render();
};
$("tabs").addEventListener("click", goStep);
$("progress").addEventListener("click", goStep);
$("gear").onclick = () => { if (tab === "setelan") tab = back; else { back = tab; tab = "setelan"; } render(); };
$("summary").onclick = () => { tab = "bill"; render(); };
$("reset").onclick = () => { S = SAMPLE(); open = null; tab = "match"; render(); };
// Enter on a player name adds the next player; on other fields it just closes the keyboard.
$("content").addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  e.preventDefault();
  if (e.target.dataset.col === "players") $("add-player")?.click(); else e.target.blur();
});

// Older saves had one court with start/end; turn it into the courts list.
function migrateCourts() {
  if (S.courts) return;
  const t = s => { const [h, m] = (s || "0:0").split(":").map(Number); return h * 60 + m; };
  let d = S.start && S.end ? t(S.end) - t(S.start) : 120; if (d <= 0) d += 1440;
  S.courts = [{ id: "k1", name: S.court || "Lapangan 1", start: S.start || "18:00", hours: d / 60 }];
  delete S.court; delete S.start; delete S.end;
}
// "Ditanggung" was removed for now; fold any saved covered amount into the cost itself.
function dropCovered() {
  for (const c of S.costs) if (c.covered !== undefined) { c.amount = Math.max(0, (+c.amount || 0) - (+c.covered || 0)); delete c.covered; delete c.coveredBy; }
}
window.claude?.hot?.snapshot?.(() => ({ S: JSON.parse(JSON.stringify(S)), P: Object.assign({}, P), tab }));
const boot = data => {
  if (data && data.S) { S = data.S; if (VIEWS[data.tab]) tab = data.tab; }
  if (data && data.P) P = Object.assign(P, data.P);
  migrateCourts(); dropCovered(); applyCourt(); render();
};
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
