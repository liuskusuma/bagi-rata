<style>
/* Layout: iOS app in a phone frame on wide screens, full screen on a phone. The screen ground is a court surface

:root {

  --danger: #c8372d;
  --bezel: #1a1d18;
  --shade: rgba(0, 0, 0, .22);
  --stripes: none;
  --f: "Plus Jakarta Sans", -apple-system, system-ui, sans-serif;

}

  --page: #0a0c0b; --cell: #1b1e1c; --fg: #eef2ee; --muted: #9ba39d; --sep: #323833;
  --accent-ink: #101410; --bubble: #1f3d24; --bubble-ink: #e9f0ea; --danger: #ff6b5e; --bezel: #2a2e2b;
  --shade: rgba(0, 0, 0, .55); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --page: #0a0c0b; --cell: #1b1e1c; --fg: #eef2ee; --muted: #9ba39d; --sep: #323833;

  --shade: rgba(0, 0, 0, .55); color-scheme: dark;
}

.screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background-color: var(--court); background-image: linear-gradient(var(--shade), var(--shade)), var(--stripes), var(--court-tex, none); display: flex; flex-direction: column; }

.stepper { display: flex; align-items: center; margin-left: auto; background: color-mix(in srgb, var(--muted) 18%, transparent); border-radius: 9px; }
.stepper button { width: 40px; height: 32px; font-size: 20px; color: var(--accent); }

.summary { flex: 0 0 auto; margin: 0 12px 8px; background-color: var(--court-deep); background-image: var(--stripes); color: var(--chalk); border-radius: 16px; padding: 12px 16px; box-shadow: inset 0 0 0 3px var(--court-deep), inset 0 0 0 5px var(--chalk); display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 15px; }

.nav { gap: 8px; padding-right: 12px; }

/* Soft UI (from the Default theme, after Court Finder) in every theme: cards take the court colour and stick out,
   fields are pressed in. Each theme keeps its own colours; applyCourt() sets the per-theme values. */
:root[data-skin] {
  --fg: #f5f7fc; --sep: rgba(255,255,255,.08); --bubble-ink: #f5f7fc; --danger: #ff8a7a;
  --f: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
  --raised: 9px 9px 20px var(--raise-d), -9px -9px 20px var(--raise-l);
  --raised-sm: 3px 3px 7px var(--raise-d), -3px -3px 7px var(--raise-l);
  --inset: inset 5px 5px 11px var(--raise-d), inset -5px -5px 11px var(--raise-l);
  --inset-sm: inset 3px 3px 7px var(--raise-d), inset -3px -3px 7px var(--raise-l);
  --f-display: "Exo 2", Bahnschrift, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

[data-skin] .row input, [data-skin] .row select { background: var(--well); box-shadow: var(--inset-sm); border-radius: 16px; padding: 9px 14px; font-size: 16px; color: var(--fg); }

[data-skin] .seg button { border-radius: 999px; }

const shade = (hex, a) => {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(a < 0 ? v * (1 + a) : v + (255 - v) * a));
  return "#" + c.map(v => v.toString(16).padStart(2, "0")).join("");
};
// Seamless surface tile: grass blades, clay grains or the fine sand grit of an acrylic hard court.
function surfaceTile(kind, base) {
  const N = 180, c = document.createElement("canvas"); c.width = c.height = N;
  const x = c.getContext("2d"); let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  x.fillStyle = base; x.fillRect(0, 0, N, N);
  const wrap = draw => { for (const dx of [-N, 0, N]) for (const dy of [-N, 0, N]) draw(dx, dy); };
  if (kind === "grass") {
    const tones = [-.35, -.25, -.12, 0, .1, .2, .3].map(a => shade(base, a));
    for (let i = 0; i < 3200; i++) {
      const px = rnd() * N, py = rnd() * N, len = 3 + rnd() * 7, ang = -Math.PI / 2 + (rnd() - .5) * 1.1;
      x.strokeStyle = tones[Math.floor(rnd() * tones.length)]; x.lineWidth = .7 + rnd() * .9; x.lineCap = "round";
      const ex = Math.cos(ang) * len, ey = Math.sin(ang) * len;
      wrap((dx, dy) => { x.beginPath(); x.moveTo(px + dx, py + dy); x.lineTo(px + dx + ex, py + dy + ey); x.stroke(); });
    }
  } else if (kind === "clay") {
    const tones = [-.3, -.18, -.08, .08, .16, .26].map(a => shade(base, a));
    for (let i = 0; i < 7000; i++) {
      const px = rnd() * N, py = rnd() * N, r = .4 + rnd() * 1.1;
      x.fillStyle = tones[Math.floor(rnd() * tones.length)];
      wrap((dx, dy) => { x.beginPath(); x.arc(px + dx, py + dy, r, 0, 7); x.fill(); });
    }
    // faint sweep marks left by the line brush
    x.globalAlpha = .06; x.strokeStyle = "#fff";
    for (let i = 0; i < 14; i++) { const py = rnd() * N; x.lineWidth = 1 + rnd() * 2; x.beginPath(); x.moveTo(0, py); x.lineTo(N, py + (rnd() - .5) * 6); x.stroke(); }
    x.globalAlpha = 1;
  } else {
    for (let i = 0; i < 9000; i++) {
      const px = Math.floor(rnd() * N), py = Math.floor(rnd() * N), light = rnd() < .5;
      x.fillStyle = light ? `rgba(255,255,255,${.04 + rnd() * .09})` : `rgba(0,0,0,${.05 + rnd() * .12})`;
      x.fillRect(px, py, 1, 1);
    }
  }
  return `url(${c.toDataURL("image/png")})`;
}

const tileCache = {};

// Lightens a colour until it reads at 4.5:1 on every background given (text on cards and fields).
const lum = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }).reduce((a, v, i) => a + v * [.2126, .7152, .0722][i], 0); };

const rb = n => { const k = Math.round(n) / 1000; return (Number.isInteger(k) ? k : +k.toFixed(1)) + L().k; };
const fmt = v => Math.round(v).toLocaleString("id-ID");
// Rupiah amounts are whole numbers; dots and commas are thousand separators.
const num = v => +String(v).replace(/\D/g, "") || 0;
const money = v => (+v ? (+v).toLocaleString("id-ID") : "");

// Money fields format thousands while typing (600000 shows as 600.000); runs before the field handlers.
document.addEventListener("input", e => {
  const el = e.target; if (!el.classList || !el.classList.contains("money")) return;
  const pos = el.selectionStart ?? el.value.length;
  const digitsRight = el.value.slice(pos).replace(/\D/g, "").length;
  el.value = money(num(el.value));
  let i = el.value.length, seen = 0;
  while (i > 0 && seen < digitsRight) { i--; if (/\d/.test(el.value[i])) seen++; }
  try { el.setSelectionRange(i, i); } catch (err) {}
}, true);

const BULAN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function dateLine(v) {
  if (!v) return "";
  const [y, m, d] = v.split("-").map(Number);
  return `${L().days[new Date(y, m - 1, d).getDay()]}, ${d} ${BULAN[m - 1]}`;
}
// Session runs from the earliest court start to the latest court end (minutes; wraps past midnight).
const toMin = v => { const [h, m] = (v || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
function span() {
  if (!S.courts.length) return { a: 0, b: 0, list: [] };
  const first = Math.min(...S.courts.map(c => toMin(c.start)));
  const list = S.courts.map(c => { let a = toMin(c.start) - first; if (a < 0) a += 1440; return { c, a: a / 60, b: a / 60 + (+c.hours || 0) }; });
  return { a: first, b: Math.max(...list.map(x => x.b)), list };
}
const fullHours = () => span().b;
const courtHours = () => S.courts.reduce((t, c) => t + (+c.hours || 0), 0);
const sessionStart = () => S.courts.length ? clock(0) : "";
const sessionEnd = () => S.courts.length ? clock(fullHours()) : "";
function clock(offset) {
  const first = S.courts.length ? Math.min(...S.courts.map(c => toMin(c.start))) : 0;
  const t = ((Math.round(first + offset * 60) % 1440) + 1440) % 1440;
  return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
}
const PID = () => S.payerMode === "other" ? "" : S.payer;
const hoursOf = p => { const x = S.partial.find(q => q.player === p.id); return x ? +x.hours || 0 : fullHours(); };
const hasHourly = () => S.costs.some(c => c.split === "hours");

// Per-hour costs are split hour by hour among the players on court; early leavers count from the start.
function compute() {
  const ps = S.players, T = L();
  const rows = ps.map(p => ({ p, parts: {}, food: 0, foodLines: [] }));
  if (S.foodOn) for (const f of S.foodItems) {
    const who = f.who.filter(id => ps.some(p => p.id === id)); if (!who.length) continue;
    const each = f.mode === "split" ? (+f.price || 0) / who.length : +f.price || 0;
    for (const r of rows) if (who.includes(r.p.id)) {
      r.food += each;
      r.foodLines.push(f.mode === "split" ? `${f.name}: ${fmt(+f.price || 0)} ÷ ${who.length} ${T.people} = ${fmt(each)}` : `${f.name}: ${fmt(each)}`);
    }
  }
  // Per-hour costs follow court-hours: each time slice costs (courts in use × its length) ÷ total court-hours,
  // shared by the players on court then. Players who left early count from the start.
  const sp = span(), H = sp.b, CH = courtHours();
  const hs = rows.map(r => Math.min(hoursOf(r.p), H));
  const pts = [...new Set([0, H, ...hs, ...sp.list.flatMap(x => [x.a, x.b])])].filter(x => x >= 0 && x <= H).sort((a, b) => a - b);
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], present = rows.map((r, j) => j).filter(j => hs[j] > a);
    const w = sp.list.filter(x => x.a <= a && x.b >= b).length;
    if (present.length && w) segs.push({ a, b, present, w });
  }
  let costTotal = 0;
  for (const c of S.costs) {
    const amt = Math.max(0, +c.amount || 0); costTotal += amt;
    rows.forEach(r => r.parts[c.id] = 0);
    if (c.split === "hours" && CH > 0) {
      for (const s of segs) for (const j of s.present) rows[j].parts[c.id] += amt * s.w * (s.b - s.a) / CH / s.present.length;
    } else for (const r of rows) r.parts[c.id] = ps.length ? amt / ps.length : 0;
  }
  const foodTotal = rows.reduce((a, r) => a + r.food, 0);
  costTotal += foodTotal;
  for (const r of rows) {
    r.raw = Object.values(r.parts).reduce((a, b) => a + b, 0) + r.food;
    const raw = Math.round(r.raw);
    r.final = S.round === "1000" ? Math.ceil(raw / 1000) * 1000 : S.round === "down1000" ? Math.floor(raw / 1000) * 1000 : raw;
  }
  const allShares = rows.reduce((a, r) => a + r.final, 0);
  const collected = rows.reduce((a, r) => a + (r.p.id === PID() ? 0 : r.final), 0);
  return { rows, costTotal, foodTotal, collected, allShares, payerShare: allShares - collected, segs, CH };
}
function buildMessage(res) {
  const lines = S.title ? [S.title] : [];
  if (S.vs) lines.push("", "VS " + S.vs);
  if (lines.length) lines.push("");
  const dl = dateLine(S.date); if (dl) lines.push(dl);
  const sp = span();
  const sameTime = sp.list.every(x => x.a === sp.list[0].a && x.b === sp.list[0].b);
  if (sameTime) {
    const names = S.courts.map(c => c.name).filter(Boolean).join(", ");
    const place = S.venue ? [S.venue, names ? `(${names})` : ""].filter(Boolean).join(" ") : names;
    if (place) lines.push("📍" + place);
    if (S.courts.some(c => c.start)) lines.push(`${sessionStart()}-${sessionEnd()}`);
  } else {
    if (S.venue) lines.push("📍" + S.venue);
    for (const x of sp.list) lines.push(`${x.c.name}: ${clock(x.a)}-${clock(x.b)}`);
  }
  lines.push("");
  for (const r of res.rows) if (r.p.name && r.p.id !== PID()) lines.push(`${r.p.name} - ${rb(r.final)}`);
  if (S.bank) lines.push("", S.bank);
  return lines.join("\n");
}

      <button type="button" class="theme" data-pref="court" data-v="${k}" aria-pressed="${P.court === k}">
        <div class="court" style="background-color:${t.base};background-image:${t.stripes ? "repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 18px, rgba(0,0,0,.08) 18px 36px)," : ""}${safeTile(t.tex, t.base)};${k === "uso" ? `box-shadow: inset 0 0 0 8px ${t.head};` : ""}"></div>
        <b>${t.name}</b><span>${T.surf[t.surf]}</span>
      </button>`).join("")}</div>
    <p class="foot">${T.themeNote}</p>`;
}
const safeTile = (kind, base) => { try { return tile(kind, base); } catch (e) { return "none"; } };

const VIEWS = { sesi: T => viewMatch(T) + viewPlace(T) + viewPay(T), match: viewMatch, place: viewPlace, pay: viewPay, players: viewPemain, cost: viewBiaya, food: viewMakanan, bill: viewTagihan, setelan: viewSetelan };

function renderChrome() {
  const T = L(), t = COURTS[P.court];
  document.documentElement.lang = P.lang;
  $("side-title").textContent = T.sideTitle; $("side-intro").textContent = T.sideIntro; $("side-sample").textContent = T.sideSample;
  $("reset").textContent = T.reset; $("guide-title").textContent = `${T.guide}: ${t.name}`; $("guide-type").textContent = T.guideType;
  $("guide-sw").innerHTML = [t.deep, t.base, t.hi, t.head, "#f4f2ea", t.accentDark].map(c => `<span style="background:${c}"></span>`).join("");
  $("gear").setAttribute("aria-label", T.settings); $("gear").setAttribute("aria-pressed", tab === "setelan");
  $("modesw").setAttribute("aria-label", T.mode);
  $("modesw").querySelectorAll("button").forEach(b => { b.setAttribute("aria-pressed", b.dataset.mode === P.mode); b.setAttribute("aria-label", b.dataset.mode === "guided" ? T.guided : T.standard); b.title = b.getAttribute("aria-label"); });
}
function render(keepScroll) {
  if (!guided()) return renderTabs(keepScroll);
  const T = L(), content = $("content"), top = content.scrollTop, i = STEPS.indexOf(tab);
  $("tabs").className = "stepbar"; $("progress").hidden = i < 0;
  $("nav-title").textContent = T.tabs[tab];
  $("nav-sub").textContent = i >= 0 ? `${T.stepOf(i + 1, STEPS.length)} · ${T.subs[tab]}` : T.subs[tab];
  $("progress").innerHTML = STEPS.map((k, j) => `<button type="button" data-tab="${k}" class="${j <= i ? "done" : ""}" aria-label="${T.tabs[k]}"${k === tab ? ' aria-current="step"' : ""}></button>`).join("");
  content.innerHTML = VIEWS[tab](T);
  content.scrollTop = keepScroll ? top : 0;
  $("tabs").innerHTML = i < 0 ? `<button type="button" class="next" data-tab="${back}">${T.done}</button>`
    : (i > 0 ? `<button type="button" class="prev" data-tab="${STEPS[i - 1]}">‹ ${T.back}</button>` : "")
      + (i < STEPS.length - 1 ? `<button type="button" class="next" data-tab="${STEPS[i + 1]}">${T.next(T.tabs[STEPS[i + 1]])} ›</button>`
        : `<button type="button" class="next alt" id="new-bill">${T.newBill}</button>`);
  renderChrome();
  renderSummary();
}
function renderTabs(keepScroll) {
  const T = L(), content = $("content"), top = content.scrollTop;
  $("nav-title").textContent = T.tabs[tab];
  $("nav-sub").textContent = T.subs[tab];
  $("progress").hidden = true;
  content.innerHTML = VIEWS[tab](T);
  content.scrollTop = keepScroll ? top : 0;
  $("tabs").className = "tabs";
  $("tabs").innerHTML = TABS.map(k => `<button type="button" data-tab="${k}"${k === tab ? ' aria-current="page"' : ""}>${TAB_ICON[k]}<span>${T.tabs[k]}</span></button>`).join("");
  renderChrome();
  renderSummary();
}
function setMode(m) {
  if (m === P.mode) return;
  P.mode = m;
  if (tab === "setelan") back = toMode(back, m); else tab = toMode(tab, m);
}
// Long titles (like "Waktu & Tempat") shrink to fit beside the header buttons instead of being cut off.
function fitTitle() {
  const h = $("nav-title"); h.style.fontSize = "";
  let size = parseFloat(getComputedStyle(h).fontSize);
  while (h.scrollWidth > h.clientWidth && size > 17) h.style.fontSize = (--size) + "px";
}
function renderSummary() {
  fitTitle();
  const res = compute();
  $("summary").hidden = guided() ? !["players", "cost", "food"].includes(tab) || !S.players.length : tab === "bill" || tab === "setelan";
  $("summary").innerHTML = `<span>${L().billing(res.rows.length - (PID() ? 1 : 0))}</span><b>${rp(res.collected)} ›</b>`;
  save();
}
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1600); }

function removePlayer(id) {
  S.players = S.players.filter(p => p.id !== id);
  S.partial = S.partial.filter(q => q.player !== id);
  S.foodItems.forEach(f => f.who = f.who.filter(x => x !== id));
  if (S.payer === id) S.payer = "";
}
function onEdit(e) {
  const el = e.target;
  if (el.dataset.s) {
    S[el.dataset.s] = el.value;
    if (e.type === "change" && el.dataset.re !== undefined) render(true);
  } else if (el.dataset.col) {
    const item = S[el.dataset.col].find(x => x.id === el.dataset.id);
    item[el.dataset.k] = el.classList.contains("money") ? num(el.value) : el.value;
    if (e.type === "change" && el.dataset.re !== undefined) render(true);
  } else if (el.dataset.payee !== undefined) {
    const v = el.value.trim(), p = S.players.find(x => x.id === S.payer);
    if (v && p) p.name = el.value;
    else if (v) { const id = uid("p"); S.players.unshift({ id, name: el.value }); S.payer = id; }
    else if (p) { removePlayer(p.id); }
    if (e.type === "change") {
      const me = S.players.find(x => x.id === S.payer), twin = me && S.players.find(x => x !== me && x.name.trim().toLowerCase() === me.name.trim().toLowerCase());
      if (twin) { removePlayer(me.id); S.payer = twin.id; el.value = twin.name; }
    }
  } else if (el.dataset.partial !== undefined) {
    S.partial[+el.dataset.partial].player = el.value;
    if (e.type === "change") render(true);
  } else return;
  renderSummary();
}
$("content").addEventListener("input", onEdit);
$("content").addEventListener("change", onEdit);
// Group titles mirror the name fields; update them in place so a tap on another button is not lost to a re-render.
$("content").addEventListener("input", e => {
  const el = e.target, col = el.dataset.col;
  if (el.dataset.k !== "name" || (col !== "costs" && col !== "foodItems")) return;
  const t = el.closest(".group")?.previousElementSibling?.querySelector("span");
  if (t) t.textContent = el.value || (col === "costs" ? L().cost : L().food);
});

$("content").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset, T = L();
  if (d.pref === "mode") setMode(d.v);
  else if (d.pref) { P[d.pref] = d.v; if (d.pref === "court") applyCourt(); }
  else if (d.v !== undefined) {
    if (d.s) S[d.s] = d.v; else S[d.col].find(x => x.id === d.id)[d.k] = d.v;
  } else if (d.delPlayer) removePlayer(d.delPlayer); else if (d.delPartial !== undefined) S.partial.splice(+d.delPartial, 1);
  else if (d.step) { const q = S.partial[+d.i]; q.hours = Math.min(fullHours(), Math.max(0, q.hours + +d.step)); }
  else if (d.courtStep) { const c = S.courts.find(x => x.id === d.id); c.hours = Math.max(0.5, Math.min(24, c.hours + +d.courtStep)); }
  else if (d.delCourt) S.courts = S.courts.filter(c => c.id !== d.delCourt);
  else if (b.id === "add-court") { const last = S.courts[S.courts.length - 1]; S.courts.push({ id: uid("k"), name: (() => { let n = S.courts.length + 1; while (S.courts.some(c => c.name === T.courtN(n))) n++; return T.courtN(n); })(), start: last ? last.start : "18:00", hours: last ? last.hours : 2 }); }
  else if (d.delCost) S.costs = S.costs.filter(c => c.id !== d.delCost);
  else if (d.delFood) S.foodItems = S.foodItems.filter(f => f.id !== d.delFood);
  else if (d.food) { const f = S.foodItems.find(x => x.id === d.food); f.who = f.who.includes(d.p) ? f.who.filter(x => x !== d.p) : f.who.concat(d.p); }
  else if (d.open) open = open === d.open ? null : d.open;
  else if (b.id === "food-switch") S.foodOn = !S.foodOn;
  else if (b.id === "add-player") { S.players.push({ id: uid("p"), name: "" }); render(true); const ins = $("content").querySelectorAll('[data-col="players"]'); ins[ins.length - 1]?.focus(); return; }
  else if (b.id === "add-partial") { const free = S.players.find(p => !S.partial.some(q => q.player === p.id)); S.partial.push({ player: free.id, hours: Math.max(0, fullHours() - 1) }); }
  else if (b.id === "add-cost") S.costs.push({ id: uid("c"), name: T.newCost, amount: 0, split: "equal" });
  else if (b.id === "add-food") S.foodItems.push({ id: uid("f"), name: "", price: 0, mode: "each", who: [] });
  else if (b.id === "copy") {
    const text = buildMessage(compute());
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("content").querySelector(".bubble")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(T.selectFallback); };
    try { navigator.clipboard.writeText(text).then(() => toast(L().copied), fallback); } catch (err) { fallback(); }
    return;
  } else return;
  render(true);
});
const goStep = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "new-bill") { if (!confirm(L().newConfirm)) return; S = SAMPLE(); open = null; tab = guided() ? "match" : "sesi"; }
  else if (b.dataset.tab) tab = b.dataset.tab; else return;
  render();
};
$("tabs").addEventListener("click", goStep);
$("progress").addEventListener("click", goStep);
$("modesw").addEventListener("click", e => { const b = e.target.closest("[data-mode]"); if (b) { setMode(b.dataset.mode); render(); } });
$("gear").onclick = () => { if (tab === "setelan") tab = back; else { back = tab; tab = "setelan"; } render(); };
$("summary").onclick = () => { tab = "bill"; render(); };
$("reset").onclick = () => { S = SAMPLE(); open = null; tab = guided() ? "match" : "sesi"; render(); };
// Enter on a player name adds the next player; on other fields it just closes the keyboard.
$("content").addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  e.preventDefault();
  if (e.target.dataset.col === "players") $("add-player")?.click(); else e.target.blur();
});

// Older saves had one court with start/end; turn it into the courts list.
function migrateCourts() {
  if (S.courts) return;
  const t = s => { const [h, m] = (s || "0:0").split(":").map(Number); return h * 60 + m; };
  let d = S.start && S.end ? t(S.end) - t(S.start) : 120; if (d <= 0) d += 1440;
  S.courts = [{ id: "k1", name: S.court || "Lapangan 1", start: S.start || "18:00", hours: d / 60 }];
  delete S.court; delete S.start; delete S.end;
}
// "Ditanggung" was removed for now; fold any saved covered amount into the cost itself.
function dropCovered() {
  for (const c of S.costs) if (c.covered !== undefined) { c.amount = Math.max(0, (+c.amount || 0) - (+c.covered || 0)); delete c.covered; delete c.coveredBy; }
}
window.claude?.hot?.snapshot?.(() => ({ S: JSON.parse(JSON.stringify(S)), P: Object.assign({}, P), tab }));
const boot = data => {
  if (data && data.S) { S = data.S; if (VIEWS[data.tab]) tab = data.tab; }
  if (data && data.P) P = Object.assign(P, data.P);
  tab = tab === "setelan" ? tab : toMode(tab, P.mode);
  if (data && data.P) P = Object.assign(P, data.P);
  migrateCourts(); dropCovered(); if (!S.payerMode) { S.payerMode = "player"; S.payerName = S.payerName || ""; } applyCourt(); render();
  document.fonts?.ready?.then(fitTitle);
};
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
